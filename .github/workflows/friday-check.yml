name: Friday Check
# Talks to Friday (the owner's voice assistant) with a test key and prints the answers.
on:
  workflow_dispatch:
    inputs:
      questions: { description: "Questions separated by |", required: false }
      voice_design: { description: "Describe a new voice for Friday (optional)", required: false }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/friday-check.mjs
        env:
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          QUESTIONS: ${{ inputs.questions }}
          VOICE_DESIGN: ${{ inputs.voice_design }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLABS_KEY || secrets.ELEVEN_LABS_API_KEY || secrets.ELEVENLABS }}
