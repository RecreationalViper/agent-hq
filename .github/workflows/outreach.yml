name: Church Outreach
# Finds church office emails and, once the owner approves (outreach/config.json), emails a few churches a weekday.
on:
  schedule:
    - cron: "17 14 * * 1-5" # about 9am New York, weekdays: find emails, send today's batch (if approved), check replies
    - cron: "47 */3 * * *" # every 3 hours: check for replies and tell the owner on Discord
  workflow_dispatch:
    inputs:
      mode: { description: "leads | discover | preview | send | replies", required: true, default: "preview" }
permissions:
  contents: write
concurrency: outreach
jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Find church emails (Mondays also look for new churches)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 14 * * 1-5') || inputs.mode == 'leads' || inputs.mode == 'discover'
        run: node tools/church-leads.mjs $( [ "$(TZ=America/New_York date +%u)" = "1" ] || [ "${{ inputs.mode }}" = "discover" ] && echo --discover )
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      - name: Email churches (only if approved)
        if: (github.event_name == 'schedule' && github.event.schedule == '17 14 * * 1-5') || inputs.mode == 'send' || inputs.mode == 'preview'
        run: node tools/outreach.mjs ${{ inputs.mode == 'preview' && '--preview' || '' }}
        env:
          FUNNEL_MAILING_ADDRESS: ${{ secrets.FUNNEL_MAILING_ADDRESS }}
          GMAIL_SHOP_REFRESH_TOKEN: ${{ secrets.GMAIL_SHOP_REFRESH_TOKEN }}
          GMAIL_SHOP_CLIENT_ID: ${{ secrets.GMAIL_SHOP_CLIENT_ID }}
          GMAIL_SHOP_CLIENT_SECRET: ${{ secrets.GMAIL_SHOP_CLIENT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Check replies and tell the owner
        if: github.event_name == 'schedule' || inputs.mode == 'replies'
        run: node tools/outreach-replies.mjs
        env:
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          GMAIL_SHOP_REFRESH_TOKEN: ${{ secrets.GMAIL_SHOP_REFRESH_TOKEN }}
          GMAIL_SHOP_CLIENT_ID: ${{ secrets.GMAIL_SHOP_CLIENT_ID }}
          GMAIL_SHOP_CLIENT_SECRET: ${{ secrets.GMAIL_SHOP_CLIENT_SECRET }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Save
        if: always()
        run: SAVE_STRATEGY="-X theirs" bash tools/save.sh "Church outreach update" outreach exa-usage.json
