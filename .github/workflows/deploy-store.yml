name: Deploy Store (Cloudflare Pages)
# Publishes store/ to Cloudflare Pages (free) at https://foreverheld.pages.dev
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["store/**"]
permissions:
  contents: read
concurrency: deploy-store
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the Pages project (first time only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create foreverheld --production-branch main || echo "project already exists (fine)"
      - name: Publish the store
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # Cloudflare's API sometimes drops the connection; try up to 3 times and fail loudly if all do.
          for i in 1 2 3; do
            if npx --yes wrangler@4 pages deploy store --project-name foreverheld --branch main --commit-dirty=true 2>&1 | tee deploy.log; then ok=1; break; fi
            echo "Publish attempt $i failed; retrying in 20s"; sleep 20
          done
          [ "${ok:-}" = 1 ] || { echo "RESULT: store publish FAILED after 3 tries" | tee -a $GITHUB_STEP_SUMMARY; exit 1; }
          echo "RESULT: store live at https://foreverheld.pages.dev" | tee -a $GITHUB_STEP_SUMMARY
          # Confirm the security headers are being served
          curl -sSI https://foreverheld.pages.dev/ | grep -iE "content-security-policy|strict-transport" | cut -c1-80 | tee -a $GITHUB_STEP_SUMMARY || true
      - name: Tell search engines (IndexNow)
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: sleep 20 && node tools/indexnow.mjs
      - name: Tell Discord
        if: always()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node -e 'import("./discord.mjs").then(({alert}) => alert(process.argv[1]))' "${{ steps.deploy.outcome == 'success' && '🌐 Store published: https://foreverheld.pages.dev' || '⚠️ Store publish to Cloudflare Pages failed: check the Deploy Store workflow log' }}"
