name: Deploy Store (Cloudflare Pages)
# Publishes store/ to Cloudflare Pages (free) at https://foreverheld.pages.dev
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["store/**"]
permissions:
  contents: read
concurrency: deploy-store
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the Pages project (first time only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create foreverheld --production-branch main || echo "project already exists (fine)"
      - name: Publish the store
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy store --project-name foreverheld --branch main --commit-dirty=true | tee deploy.log
          echo "RESULT: store live at https://foreverheld.pages.dev" | tee -a $GITHUB_STEP_SUMMARY
      - name: Tell Discord
        if: always()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          node -e 'import("./discord.mjs").then(({alert}) => alert(process.argv[1]))' "${{ steps.deploy.outcome == 'success' && '🌐 Store published: https://foreverheld.pages.dev' || '⚠️ Store publish to Cloudflare Pages failed: check the Deploy Store workflow log' }}"
