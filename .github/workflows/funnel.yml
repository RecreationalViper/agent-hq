name: Email Funnel
# Welcome series for new checklist subscribers (day 1, 3, 7) from the shop Gmail. Off until FUNNEL_MAILING_ADDRESS is saved.
on:
  schedule:
    - cron: "23 */3 * * *" # every 3 hours
  push:
    branches: [main]
    paths: [email/test-request.txt] # change this file to send a [Test] copy of every step to the list (3 people max)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send nothing)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: email-funnel
jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Send due welcome emails
        run: node tools/funnel.mjs ${{ github.event_name == 'push' && '--test' || (github.event.inputs.dry_run == 'true' && '--dry-run' || '') }}
        env:
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          FUNNEL_MAILING_ADDRESS: ${{ secrets.FUNNEL_MAILING_ADDRESS }}
          GMAIL_SHOP_REFRESH_TOKEN: ${{ secrets.GMAIL_SHOP_REFRESH_TOKEN }}
          GMAIL_SHOP_CLIENT_ID: ${{ secrets.GMAIL_SHOP_CLIENT_ID }}
          GMAIL_SHOP_CLIENT_SECRET: ${{ secrets.GMAIL_SHOP_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Save progress (hashed emails only)
        if: github.event.inputs.dry_run != 'true' && github.event_name != 'push'
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email/funnel-state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Email funnel progress" && git pull --rebase -X theirs && git push)
