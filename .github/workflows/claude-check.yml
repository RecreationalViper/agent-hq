name: Claude Check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: agent-hq
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the Claude key
        run: node tools/claude-check.mjs
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      - name: Save the result
        if: always()
        run: |
          bash tools/save.sh "Claude Check result" reports/claude-check.md claude-usage.json
