name: Provider Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check AI keys
        run: node tools/provider-check.mjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY || secrets.GROQ }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY || secrets.EXA_KEY || secrets.EXA || secrets.EXA_API_KEY_1 || secrets.EXA_KEY_1 || secrets.EXA1 }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 || secrets.EXA_API_KEY2 || secrets.EXA_KEY_2 || secrets.EXA_KEY2 || secrets.EXA2 || secrets.EXA_2 }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 }}
          EXA_API_KEY2: ${{ secrets.EXA_API_KEY2 }}
          EXA_KEY: ${{ secrets.EXA_KEY }}
          EXA_KEY_2: ${{ secrets.EXA_KEY_2 }}
          EXA: ${{ secrets.EXA }}
          EXA_2: ${{ secrets.EXA_2 }}
          EXA_AI_KEY: ${{ secrets.EXA_AI_KEY }}
          EXA_AI_API_KEY: ${{ secrets.EXA_AI_API_KEY }}
          EXA_SEARCH_KEY: ${{ secrets.EXA_SEARCH_KEY }}
          EXA_SECOND_KEY: ${{ secrets.EXA_SECOND_KEY }}
          EXA_API_KEY_1: ${{ secrets.EXA_API_KEY_1 }}
          EXA_KEY_1: ${{ secrets.EXA_KEY_1 }}
          EXA_AI: ${{ secrets.EXA_AI }}
          EXAAI_API_KEY: ${{ secrets.EXAAI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED_KEY || secrets.FRED }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
