name: Deploy Sales Feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["workers/sales/**"]
permissions:
  contents: write
concurrency: agent-hq
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the sales feed on Cloudflare
        run: node tools/deploy-sales-feed.mjs
        env:
          CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          DISCORD_SALES_WEBHOOK: ${{ secrets.DISCORD_SALES_WEBHOOK }}
      - name: Save the feed address
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales-feed.json
          git diff --cached --quiet || (git commit -m "Sales feed address" && git pull --rebase && git push)
