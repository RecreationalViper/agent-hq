name: Deploy Sales Feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["workers/sales/**", "discord.json", "agents.json", "tools/deploy-sales-feed.mjs"]
permissions:
  contents: write
concurrency: agent-hq
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the sales feed on Cloudflare
        run: node tools/deploy-sales-feed.mjs
        env:
          CLOUDFLARE_WORKERS_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_KEY || secrets.NIM_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      - name: Smoke-test Friday after deploy (fails the run if she crashes)
        env:
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
        run: |
          sleep 10
          KEY=$(printf "friday-check:%s" "$(echo -n "$PAYHIP_API_KEY" | tr -d '[:space:]')" | sha256sum | cut -d' ' -f1)
          CODE=$(curl -s -o /tmp/f.json -w "%{http_code}" -m 60 -X POST https://foreverheld-sales.foreverheld.workers.dev/friday -H "x-friday-key: $KEY" -H "content-type: application/json" -d '{"q":"ping"}')
          echo "Friday answered HTTP $CODE"; head -c 200 /tmp/f.json | grep -o '"error":"[^"]*"' || true
          test "$CODE" = "200"
      - name: Save the feed address
        run: |
          SAVE_STRATEGY="-X theirs" bash tools/save.sh "Sales feed address" sales-feed.json
      - name: Tell Discord if this run failed
        if: failure()
        run: node tools/discord-alert.mjs "Sales feed install run failed"
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
