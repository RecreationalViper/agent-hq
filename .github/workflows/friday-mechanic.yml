name: Friday Mechanic
# Friday's self-repair loop: checks her health, reads her error log and wish list, writes one small fix,
# and opens a pull request. Nothing goes live until the owner taps Merge. Friday can start it ("fix yourself").
on:
  schedule:
    - cron: "23 7 * * *" # ~2:23 AM Eastern
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only (no pull request)"
        type: boolean
        default: false
      wish:
        description: "Something Friday should learn (optional)"
        type: string
        default: ""
permissions:
  contents: write
  pull-requests: write
concurrency: friday-mechanic
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Friday, write one fix, open a pull request
        run: node tools/friday-mechanic.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTRA_WISH: ${{ github.event.inputs.wish }}
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Save Claude spending
        if: always() && github.event.inputs.dry_run != 'true'
        run: bash tools/save.sh "Friday Mechanic usage" claude-usage.json || true
      - name: Tell Discord if this run failed
        if: failure()
        run: node tools/discord-alert.mjs "Friday Mechanic run failed"
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
