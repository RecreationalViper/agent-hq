name: Store Assets
on:
  workflow_dispatch:
    inputs:
      images:
        description: 'JSON of image name -> download URL (optional)'
        default: '{}'
permissions:
  contents: write
concurrency: agent-hq
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install a browser
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Build images, logo and screenshots
        run: node tools/build-store-assets.mjs
        env:
          IMAGES: ${{ github.event.inputs.images }}
          PW_PATH: /tmp/pw/node_modules/playwright
      - name: Save
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store
          git diff --cached --quiet || (git commit -m "Store assets" && git pull --rebase && git push)
