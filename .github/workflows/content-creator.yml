name: Content Creator
on:
  schedule:
    - cron: "7 11 * * *" # 6:07am New York; GitHub starts scheduled runs hours late at busy times, so this lands late morning
  workflow_dispatch:
    inputs:
      make:
        description: "What to make"
        type: choice
        options: [posts, landing]
        default: posts
      posts:
        description: "How many posts to make"
        default: "8"
permissions:
  contents: write
concurrency: agent-hq
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the design browser
        run: npm i --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Refresh Pinterest stats (read-only)
        run: node tools/pinterest-stats.mjs
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      - name: Write, design and post this week's content
        run: node ${{ github.event.inputs.make == 'landing' && 'landing.mjs' || 'content-creator.mjs' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY || secrets.GROQ }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          REQUESTY_KEY: ${{ secrets.REQUESTY_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_KEY || secrets.NVIDIA_NIM_API_KEY || secrets.NIM_API_KEY || secrets.NGC_API_KEY || secrets.NVIDIA }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 || secrets.EXA_KEY_2 || secrets.EXA_API_KEY2 }}
          ART_API_KEY: ${{ secrets.ART_API_KEY }}
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          CREATOR_POSTS: ${{ github.event.inputs.posts || '8' }}
      - name: Keep the images for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-images
          path: |
            content/*/*.jpg
            content/*/*.pdf
          retention-days: 30
          if-no-files-found: ignore
      - name: Save report and notes for the team
        if: always()
        run: |
          # Other agents push all day: save.sh rebases and retries so a race never loses the pins.
          SAVE_STRATEGY="-X theirs" SAVE_RETRIES=5 bash tools/save.sh "Content Creator update" \
            reports content pinterest exa-usage.json claude-usage.json store/landing store/pins store/ig ploy/shift
      - name: Tell Discord if this run failed
        if: failure()
        run: node tools/discord-alert.mjs "Content Creator run failed"
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  publish:
    needs: create
    if: always()
    uses: ./.github/workflows/deploy-store.yml
    secrets: inherit
