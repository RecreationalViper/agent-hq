name: Content Creator
on:
  schedule:
    - cron: "23 15 * * 2,5" # Tuesday and Friday, about 10:23am New York time
  workflow_dispatch:
    inputs:
      make:
        description: "What to make"
        type: choice
        options: [posts, landing]
        default: posts
      posts:
        description: "How many posts to make"
        default: "5"
permissions:
  contents: write
concurrency: agent-hq
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the design browser
        run: npm i --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Refresh Pinterest stats (read-only)
        run: node tools/pinterest-stats.mjs
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      - name: Write, design and post this week's content
        run: node ${{ github.event.inputs.make == 'landing' && 'landing.mjs' || 'content-creator.mjs' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY || secrets.GROQ }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY || secrets.REQUESTY_KEY || secrets.REQUESTY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_KEY || secrets.NVIDIA_NIM_API_KEY || secrets.NIM_API_KEY || secrets.NGC_API_KEY || secrets.NVIDIA }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 || secrets.EXA_KEY_2 || secrets.EXA_API_KEY2 }}
          ART_API_KEY: ${{ secrets.ART_API_KEY }}
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          CREATOR_POSTS: ${{ github.event.inputs.posts || '5' }}
      - name: Keep the images for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-images
          path: |
            content/*/*.jpg
            content/*/*.pdf
          retention-days: 30
          if-no-files-found: ignore
      - name: Save report and notes for the team
        if: always()
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in reports content pinterest exa-usage.json claude-usage.json store/landing store/pins ploy/shift; do [ -e "$p" ] && git add -A "$p"; done; true
          git diff --cached --quiet || (git commit -m "Content Creator update" && git pull --rebase && git push)
  publish:
    needs: create
    if: always()
    uses: ./.github/workflows/deploy-store.yml
    secrets: inherit
