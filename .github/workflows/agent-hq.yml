# Agent HQ - paste this whole file into .github/workflows/agent-hq.yml
# First run installs the website + agents, then runs your agents on schedule.
name: Agent HQ
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "due, all, or an agent id"
        default: "all"
permissions:
  contents: write
concurrency: agent-hq
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Agent HQ files (only adds files that are missing)
        run: |
          [ -f index.html ] || cat > index.html <<'AHQ_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-title" content="Agent HQ">
          <meta name="theme-color" content="#1f2a24">
          <title>Agent HQ</title>
          <style>
          :root{--bg:#f6f5f1;--card:#fff;--ink:#1d1f1c;--mute:#6b6f68;--line:#e2e0d8;--accent:#3d6b55;--accent-ink:#fff;--warn:#a8432f;--soft:#eef3ef}
          @media (prefers-color-scheme:dark){:root{--bg:#121412;--card:#1c1f1c;--ink:#ecebe6;--mute:#9a9e96;--line:#2e322e;--accent:#7fb497;--accent-ink:#0f1511;--warn:#e08a74;--soft:#1f2a24}}
          *{box-sizing:border-box}
          html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
          header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
          header h1{margin:0;font-size:20px}
          nav{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
          nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:999px;font-size:14px}
          nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
          main{padding:16px;max-width:760px;margin:0 auto;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
          section{display:none}section.on{display:block}
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
          label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
          input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
          textarea{min-height:90px;resize:vertical}
          .btn{display:inline-block;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);margin-top:10px}
          .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
          .btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
          .btn:disabled{opacity:.5}
          .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
          .mute{color:var(--mute);font-size:14px}
          .msg{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:normal;word-wrap:break-word}
          .msg.user{background:var(--soft);margin-left:15%}
          .msg.ai{background:var(--card);border:1px solid var(--line)}
          .msg .who{font-size:12px;color:var(--mute);margin-bottom:4px}
          .log{font-size:14px;border-left:3px solid var(--accent);padding:4px 10px;margin:6px 0}
          .log.err{border-color:var(--warn);color:var(--warn)}
          .out h2,.out h3,.out h4{margin:.6em 0 .3em;font-size:1.05em}
          .out ul,.out ol{padding-left:1.2em;margin:.3em 0}
          .out p{margin:.4em 0}
          .out code{background:var(--soft);padding:1px 4px;border-radius:4px}
          .agent-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
          .agent-head b{font-size:16px}
          details summary{cursor:pointer;color:var(--mute);font-size:14px}
          .pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mute)}
          </style>
          </head>
          <body>
          <header>
            <h1>Agent HQ</h1>
            <nav id="nav">
              <button data-tab="routines" class="on">Routines</button>
              <button data-tab="mission">Team mission</button>
              <button data-tab="chat">Chat</button>
              <button data-tab="agents">Agents</button>
              <button data-tab="library">Library</button>
              <button data-tab="settings">Settings</button>
            </nav>
          </header>
          <main>

          <section id="routines" class="on">
            <div class="card">
              <div class="agent-head"><b>Background agents</b><button class="btn ghost" id="refreshRoutines" style="margin-top:0">Refresh</button></div>
              <p class="mute">These run on GitHub's servers on their own schedule, even with your phone off. Edit them in <code>agents.json</code> on GitHub.</p>
              <div id="routineList"></div>
            </div>
            <div id="reportList"></div>
          </section>

          <section id="mission">
            <div class="card">
              <label for="goal">Give the team a goal</label>
              <textarea id="goal" placeholder="e.g. Plan 3 new memorial printables, write their Etsy titles and tags, and price them."></textarea>
              <div class="row">
                <button class="btn" id="runMission">Run team</button>
                <button class="btn ghost" id="stopMission" disabled>Stop</button>
              </div>
              <p class="mute">The Manager plans the work, hands each task to an agent, then writes a final summary. Keep this page open while it runs.</p>
            </div>
            <div id="missionLog"></div>
          </section>

          <section id="chat">
            <div class="card">
              <label for="chatAgent">Talk to</label>
              <select id="chatAgent"></select>
              <div id="chatThread"></div>
              <textarea id="chatInput" placeholder="Message…"></textarea>
              <div class="row">
                <button class="btn" id="sendChat">Send</button>
                <button class="btn ghost" id="saveChat">Save last reply</button>
                <button class="btn ghost" id="clearChat">Clear</button>
              </div>
            </div>
          </section>

          <section id="agents">
            <div id="agentList"></div>
            <div class="card">
              <b>Add an agent</b>
              <label for="newName">Name</label>
              <input id="newName" placeholder="e.g. TikTok Scriptwriter">
              <label for="newRole">Instructions</label>
              <textarea id="newRole" placeholder="What this agent does and how it should answer."></textarea>
              <button class="btn" id="addAgent">Add agent</button>
            </div>
            <button class="btn danger" id="resetAgents">Reset to default team</button>
          </section>

          <section id="library">
            <div id="libList"></div>
          </section>

          <section id="settings">
            <div class="card">
              <b>Free AI key (Google Gemini)</b>
              <p class="mute">Get a free key at aistudio.google.com → Get API key. It's saved only on this phone, never in the code.</p>
              <label for="apiKey">API key</label>
              <input id="apiKey" type="password" autocomplete="off" placeholder="Paste key here">
              <div class="row">
                <button class="btn" id="saveKey">Save &amp; load models</button>
                <button class="btn ghost" id="forgetKey">Forget key</button>
              </div>
              <label for="model">Model</label>
              <select id="model"></select>
              <p class="mute" id="keyStatus"></p>
            </div>
            <div class="card">
              <b>"Run now" button (optional)</b>
              <p class="mute">Lets you start background agents from this page. Make a GitHub fine-grained token for this repo only, with Actions: Read and write. Saved only on this phone.</p>
              <label for="ghToken">GitHub token</label>
              <input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_…">
              <label for="ghRepo">Repository (owner/name)</label>
              <input id="ghRepo" placeholder="yourname/agent-hq">
              <button class="btn" id="saveGh">Save</button>
            </div>
            <div class="card">
              <b>Business context</b>
              <p class="mute">Every agent reads this first.</p>
              <textarea id="context"></textarea>
              <button class="btn" id="saveContext">Save context</button>
            </div>
            <div class="card">
              <b>Limits to know</b>
              <ul class="mute">
                <li>Team missions and chat run only while this page is open. Background agents (Routines tab) run on GitHub's servers instead.</li>
                <li>Your repo is public, so anyone with the link can read the reports. Keep private details out of agents.json.</li>
                <li>Free Gemini has no live web search, so research is from the model's own knowledge.</li>
                <li>Agents can't log in to Etsy, Canva or Drive. They write drafts; you publish.</li>
                <li>Google may review free-tier conversations. Don't paste private customer info.</li>
              </ul>
            </div>
          </section>
          </main>

          <script>
          (() => {
            "use strict";
            const API = "https://generativelanguage.googleapis.com/v1beta";
            const $ = (id) => document.getElementById(id);

            // ---------- storage ----------
            const store = {
              get(k, fallback) { try { const v = localStorage.getItem("ahq_" + k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
              set(k, v) { try { localStorage.setItem("ahq_" + k, JSON.stringify(v)); } catch {} },
              del(k) { try { localStorage.removeItem("ahq_" + k); } catch {} }
            };

            const RULES = "Rules for every agent: You write drafts and recommendations only. Never claim you published a listing, spent money, sent a message, or visited a website — you cannot. Flag anything that needs the owner's approval (spending, publishing, contacting customers). Follow Etsy's Creativity Standards: original designs, disclose AI use, show real previews, no AI-written recipes, patterns or how-to instructions, never call AI work handmade. If you are unsure of a current fact (fees, policies, trends), say so instead of guessing. Keep answers short and phone-friendly.";

            const DEFAULT_CONTEXT = "Etsy shop selling original printable memorial kits (funeral/celebration-of-life programs, welcome signs, share-a-memory cards) as editable Canva templates and PDFs. Styles: Classic Elegance, Modern Minimal, Soft Watercolor Sky, Soft Botanical. Owner works only from an iPhone, budget $0, goal is sustainable side income. Buyers are grieving families: tone must be calm, respectful and simple.";

            const DEFAULT_AGENTS = [
              { id: "manager", name: "Manager", role: "You are the business manager. You break goals into clear tasks for the right departments, keep work on track, and summarize results into decisions and next steps for the owner." },
              { id: "research", name: "Product Research", role: "You find niches, customer needs, competitor gaps and product opportunities. Give demand reasoning, competitor angles and a clear recommendation." },
              { id: "dev", name: "Product Development", role: "You design original digital products: page lists, layouts, sizes, wording, styles and bundle contents, described precisely enough to build in Canva." },
              { id: "seo", name: "Etsy SEO & Marketing", role: "You write Etsy titles (under 140 characters), exactly 13 tags (each 20 characters or fewer), descriptions with an AI-use disclosure line, and TikTok/Pinterest content ideas and scripts." },
              { id: "finance", name: "Finance", role: "You price products and show the math. Assume US Etsy fees: $0.20 listing, 6.5% transaction, 3% + $0.25 processing, unless told otherwise. Show fees and profit per sale." },
              { id: "ops", name: "Operations", role: "You turn plans into checklists, workflows and records: step-by-step tasks, a product log, and a weekly routine the owner can follow on a phone." }
            ];

            let agents = store.get("agents", DEFAULT_AGENTS);
            let context = store.get("context", DEFAULT_CONTEXT);
            let library = store.get("library", []);
            let chats = store.get("chats", {});
            let apiKey = store.get("key", "");
            let model = store.get("model", "");
            let stopFlag = false;

            // ---------- tiny safe markdown ----------
            function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
            function inline(s) {
              return s.replace(/`([^`]+)`/g, "<code>$1</code>")
                      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
                      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
            }
            function md(text) {
              const lines = esc(text || "").split("\n");
              let html = "", list = null;
              const close = () => { if (list) { html += "</" + list + ">"; list = null; } };
              for (const raw of lines) {
                const line = raw.trimEnd();
                let m;
                if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); html += "<h3>" + inline(m[1]) + "</h3>"; }
                else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += "<li>" + inline(m[1]) + "</li>"; }
                else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += "<li>" + inline(m[1]) + "</li>"; }
                else if (line.trim() === "") { close(); }
                else { close(); html += "<p>" + inline(line) + "</p>"; }
              }
              close();
              return html;
            }

            // ---------- Gemini ----------
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            async function gemini(systemText, contents, { json = false } = {}) {
              if (!apiKey) throw new Error("Add your free API key in Settings first.");
              if (!model) throw new Error("Pick a model in Settings first.");
              const body = {
                systemInstruction: { parts: [{ text: systemText }] },
                contents,
                generationConfig: { temperature: 0.7 }
              };
              if (json) body.generationConfig.responseMimeType = "application/json";
              for (let attempt = 0; attempt < 3; attempt++) {
                const res = await fetch(API + "/" + model + ":generateContent", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
                  body: JSON.stringify(body)
                });
                if (res.status === 429 || res.status === 503) {
                  if (attempt === 2) throw new Error("Free limit reached for now (" + res.status + "). Wait a minute, or try again tomorrow if it's the daily limit.");
                  await sleep(20000 * (attempt + 1));
                  continue;
                }
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error((data.error && data.error.message) || ("Request failed (" + res.status + ")"));
                const cand = data.candidates && data.candidates[0];
                const text = cand && cand.content && cand.content.parts ? cand.content.parts.map(p => p.text || "").join("") : "";
                if (!text) throw new Error("Empty reply" + (cand && cand.finishReason ? " (" + cand.finishReason + ")" : "") + ". Try rephrasing.");
                return text;
              }
            }

            function systemFor(agent) {
              return "You are the " + agent.name + " agent on a small AI team.\n\nYour role: " + agent.role + "\n\nBusiness context: " + context + "\n\n" + RULES;
            }

            async function loadModels() {
              const status = $("keyStatus");
              status.textContent = "Loading models…";
              try {
                const res = await fetch(API + "/models?pageSize=200", { headers: { "x-goog-api-key": apiKey } });
                const data = await res.json();
                if (!res.ok) throw new Error((data.error && data.error.message) || "Couldn't load models.");
                const list = (data.models || [])
                  .filter(m => (m.supportedGenerationMethods || []).includes("generateContent"))
                  .filter(m => /gemini|gemma/i.test(m.name) && !/image|tts|audio|live|embed|vision-only/i.test(m.name));
                const sel = $("model");
                sel.innerHTML = "";
                list.forEach(m => { const o = document.createElement("option"); o.value = m.name; o.textContent = (m.displayName || m.name) + " — " + m.name.replace("models/", ""); sel.appendChild(o); });
                if (!list.length) throw new Error("No usable models found for this key.");
                const keep = list.find(m => m.name === model);
                const flash = list.find(m => /flash/i.test(m.name) && !/lite|preview|exp/i.test(m.name)) || list.find(m => /flash/i.test(m.name)) || list[0];
                model = keep ? keep.name : flash.name;
                sel.value = model;
                store.set("model", model);
                status.textContent = "Ready. Using " + model.replace("models/", "") + ". Flash models are the fastest on the free tier.";
              } catch (e) {
                status.textContent = "Problem: " + e.message;
              }
            }

            // ---------- tabs ----------
            $("nav").addEventListener("click", (e) => {
              const b = e.target.closest("button[data-tab]");
              if (!b) return;
              document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x === b));
              document.querySelectorAll("main section").forEach(s => s.classList.toggle("on", s.id === b.dataset.tab));
              if (b.dataset.tab === "library") renderLibrary();
              if (b.dataset.tab === "routines") renderRoutines();
              if (b.dataset.tab === "agents") renderAgents();
            });

            // ---------- library ----------
            function saveToLibrary(title, text) {
              library.unshift({ id: Date.now(), title: title.slice(0, 80), text, at: new Date().toLocaleString() });
              library = library.slice(0, 100);
              store.set("library", library);
            }
            function renderLibrary() {
              const el = $("libList");
              if (!library.length) { el.innerHTML = '<div class="card mute">Saved results show up here.</div>'; return; }
              el.innerHTML = "";
              library.forEach(item => {
                const c = document.createElement("div");
                c.className = "card";
                c.innerHTML = '<div class="agent-head"><b>' + esc(item.title) + '</b><span class="pill">' + esc(item.at) + '</span></div>' +
                  '<details><summary>Open</summary><div class="out">' + md(item.text) + '</div></details>' +
                  '<div class="row"><button class="btn ghost" data-act="copy">Copy</button><button class="btn ghost" data-act="share">Share / save</button><button class="btn danger" data-act="del">Delete</button></div>';
                c.addEventListener("click", async (e) => {
                  const act = e.target.dataset && e.target.dataset.act;
                  if (act === "copy") { try { await navigator.clipboard.writeText(item.text); e.target.textContent = "Copied"; } catch { alert("Copy failed. Open it and select the text."); } }
                  if (act === "share") { shareText(item.title, item.text); }
                  if (act === "del" && confirm("Delete this result?")) { library = library.filter(x => x.id !== item.id); store.set("library", library); renderLibrary(); }
                });
                el.appendChild(c);
              });
            }
            async function shareText(title, text) {
              if (navigator.share) {
                try {
                  const file = new File([text], title.replace(/[^\w\- ]+/g, "").trim().slice(0, 40) + ".md", { type: "text/markdown" });
                  if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ title, files: [file] }); return; }
                  await navigator.share({ title, text }); return;
                } catch (e) { if (e.name === "AbortError") return; }
              }
              const a = document.createElement("a");
              a.href = URL.createObjectURL(new Blob([text], { type: "text/markdown" }));
              a.download = "result.md"; a.click();
            }

            // ---------- agents tab ----------
            function renderAgentSelect() {
              const sel = $("chatAgent"), prev = sel.value;
              sel.innerHTML = "";
              agents.forEach(a => { const o = document.createElement("option"); o.value = a.id; o.textContent = a.name; sel.appendChild(o); });
              if (agents.some(a => a.id === prev)) sel.value = prev;
              renderChat();
            }
            function renderAgents() {
              const el = $("agentList");
              el.innerHTML = "";
              agents.forEach(a => {
                const c = document.createElement("div");
                c.className = "card";
                c.innerHTML = '<div class="agent-head"><b>' + esc(a.name) + '</b>' + (a.id === "manager" ? '<span class="pill">leads missions</span>' : '') + '</div>' +
                  '<label>Instructions</label><textarea>' + esc(a.role) + '</textarea>' +
                  '<div class="row"><button class="btn ghost" data-act="save">Save</button>' + (a.id === "manager" ? "" : '<button class="btn danger" data-act="del">Remove</button>') + '</div>';
                c.addEventListener("click", (e) => {
                  const act = e.target.dataset && e.target.dataset.act;
                  if (act === "save") { a.role = c.querySelector("textarea").value.trim() || a.role; store.set("agents", agents); e.target.textContent = "Saved"; }
                  if (act === "del" && confirm("Remove " + a.name + "?")) { agents = agents.filter(x => x.id !== a.id); store.set("agents", agents); renderAgents(); renderAgentSelect(); }
                });
                el.appendChild(c);
              });
            }
            $("addAgent").onclick = () => {
              const name = $("newName").value.trim(), role = $("newRole").value.trim();
              if (!name || !role) { alert("Give the agent a name and instructions."); return; }
              agents.push({ id: "a" + Date.now(), name, role });
              store.set("agents", agents);
              $("newName").value = ""; $("newRole").value = "";
              renderAgents(); renderAgentSelect();
            };
            $("resetAgents").onclick = () => {
              if (!confirm("Replace all agents with the default team?")) return;
              agents = JSON.parse(JSON.stringify(DEFAULT_AGENTS));
              store.set("agents", agents); renderAgents(); renderAgentSelect();
            };

            // ---------- chat ----------
            function currentAgent() { return agents.find(a => a.id === $("chatAgent").value) || agents[0]; }
            function renderChat() {
              const a = currentAgent(); if (!a) return;
              const thread = chats[a.id] || [];
              const el = $("chatThread");
              el.innerHTML = thread.length ? "" : '<p class="mute">Start a conversation with ' + esc(a.name) + '.</p>';
              thread.forEach(m => {
                const d = document.createElement("div");
                d.className = "msg " + (m.role === "user" ? "user" : "ai");
                d.innerHTML = '<div class="who">' + (m.role === "user" ? "You" : esc(a.name)) + '</div><div class="out">' + md(m.text) + '</div>';
                el.appendChild(d);
              });
            }
            $("chatAgent").onchange = renderChat;
            $("sendChat").onclick = async () => {
              const a = currentAgent(), text = $("chatInput").value.trim();
              if (!text) return;
              const thread = chats[a.id] = chats[a.id] || [];
              thread.push({ role: "user", text });
              $("chatInput").value = ""; renderChat();
              const btn = $("sendChat"); btn.disabled = true; btn.textContent = "Thinking…";
              try {
                const contents = thread.slice(-20).map(m => ({ role: m.role === "user" ? "user" : "model", parts: [{ text: m.text }] }));
                const reply = await gemini(systemFor(a), contents);
                thread.push({ role: "model", text: reply });
              } catch (e) {
                thread.push({ role: "model", text: "⚠️ " + e.message });
              }
              store.set("chats", chats); renderChat();
              btn.disabled = false; btn.textContent = "Send";
            };
            $("saveChat").onclick = () => {
              const a = currentAgent(), thread = chats[a.id] || [];
              const last = [...thread].reverse().find(m => m.role === "model");
              if (!last) { alert("No reply to save yet."); return; }
              const q = [...thread].reverse().find(m => m.role === "user");
              saveToLibrary(a.name + ": " + (q ? q.text : "reply"), last.text);
              $("saveChat").textContent = "Saved";
              setTimeout(() => $("saveChat").textContent = "Save last reply", 1500);
            };
            $("clearChat").onclick = () => { const a = currentAgent(); if (confirm("Clear this chat?")) { chats[a.id] = []; store.set("chats", chats); renderChat(); } };

            // ---------- team mission ----------
            function log(html, cls) {
              const d = document.createElement("div");
              d.className = cls === "card" ? "card" : "log" + (cls ? " " + cls : "");
              d.innerHTML = html;
              $("missionLog").appendChild(d);
              d.scrollIntoView({ behavior: "smooth", block: "end" });
              return d;
            }

            $("stopMission").onclick = () => { stopFlag = true; $("stopMission").disabled = true; log("Stopping after the current step…"); };

            $("runMission").onclick = async () => {
              const goal = $("goal").value.trim();
              if (!goal) { alert("Write a goal first."); return; }
              const manager = agents.find(a => a.id === "manager");
              const workers = agents.filter(a => a.id !== "manager");
              if (!manager || !workers.length) { alert("The team needs a Manager and at least one other agent."); return; }

              stopFlag = false;
              $("runMission").disabled = true; $("stopMission").disabled = false;
              $("missionLog").innerHTML = "";
              const results = [];

              try {
                log("Manager is planning…");
                const roster = workers.map(w => "- " + w.id + ": " + w.name + " — " + w.role).join("\n");
                const planPrompt = "Goal from the owner: " + goal + "\n\nYour team:\n" + roster +
                  "\n\nMake a plan of 2 to 5 steps. Each step is one task for one team member, in order; later steps can use earlier results. " +
                  'Reply with JSON only: {"steps":[{"agent":"<team member id>","task":"<specific instruction>"}]}';
                const planText = await gemini(systemFor(manager), [{ role: "user", parts: [{ text: planPrompt }] }], { json: true });
                let steps;
                try {
                  const clean = planText.replace(/^```(?:json)?|```$/g, "").trim();
                  steps = (JSON.parse(clean).steps || []).filter(s => s && s.task);
                } catch { throw new Error("The Manager's plan didn't come back in the right format. Try running again."); }
                steps = steps.slice(0, 5).map(s => ({ agent: workers.find(w => w.id === s.agent) || workers.find(w => w.name.toLowerCase() === String(s.agent).toLowerCase()) || workers[0], task: s.task }));
                if (!steps.length) throw new Error("The Manager returned an empty plan. Try a more specific goal.");

                log("<b>Plan</b><ol>" + steps.map(s => "<li><b>" + esc(s.agent.name) + "</b>: " + esc(s.task) + "</li>").join("") + "</ol>", "card");

                for (let i = 0; i < steps.length; i++) {
                  if (stopFlag) throw new Error("Stopped.");
                  const s = steps[i];
                  const status = log("Step " + (i + 1) + "/" + steps.length + ": " + esc(s.agent.name) + " is working…");
                  const prior = results.length ? "\n\nResults from teammates so far:\n\n" + results.map(r => "### " + r.agent + "\n" + r.text).join("\n\n") : "";
                  const text = await gemini(systemFor(s.agent), [{ role: "user", parts: [{ text: "Overall goal: " + goal + "\n\nYour task: " + s.task + prior }] }]);
                  results.push({ agent: s.agent.name, task: s.task, text });
                  status.textContent = "Step " + (i + 1) + "/" + steps.length + ": " + s.agent.name + " done.";
                  log("<details><summary><b>" + esc(s.agent.name) + "</b> — " + esc(s.task) + "</summary><div class='out'>" + md(text) + "</div></details>", "card");
                }

                if (stopFlag) throw new Error("Stopped.");
                log("Manager is writing the summary…");
                const all = results.map(r => "### " + r.agent + " (task: " + r.task + ")\n" + r.text).join("\n\n");
                const summary = await gemini(systemFor(manager), [{ role: "user", parts: [{ text: "Goal: " + goal + "\n\nTeam results:\n\n" + all + "\n\nWrite the final report for the owner: the key results, decisions they need to make, anything needing their approval, and the next 3 steps. Be concise." }] }]);
                log("<b>Final report</b><div class='out'>" + md(summary) + "</div>", "card");

                const full = "# " + goal + "\n\n## Final report\n\n" + summary + "\n\n---\n\n" + results.map(r => "## " + r.agent + "\n_Task: " + r.task + "_\n\n" + r.text).join("\n\n");
                saveToLibrary("Mission: " + goal, full);
                log("Saved to Library.");
              } catch (e) {
                if (results.length) saveToLibrary("Partial mission: " + goal, results.map(r => "## " + r.agent + "\n" + r.text).join("\n\n"));
                log(esc(e.message) + (results.length ? " Finished steps were saved to Library." : ""), "err");
              } finally {
                $("runMission").disabled = false; $("stopMission").disabled = true;
              }
            };

            // ---------- routines (GitHub Actions background agents) ----------
            let ghToken = store.get("ghToken", "");
            function guessRepo() {
              const host = location.hostname, seg = location.pathname.split("/").filter(Boolean)[0];
              return host.endsWith(".github.io") && seg ? host.split(".")[0] + "/" + seg : "";
            }
            let ghRepo = store.get("ghRepo", "") || guessRepo();
            const SCHEDULES = { daily: "Every day", weekdays: "Weekdays", manual: "Only when you run it" };
            const DAYS = { mon: "Mondays", tue: "Tuesdays", wed: "Wednesdays", thu: "Thursdays", fri: "Fridays", sat: "Saturdays", sun: "Sundays" };
            function scheduleLabel(s) {
              s = String(s || "manual").toLowerCase();
              const m = s.match(/^weekly:([a-z]{3})$/);
              return m ? (DAYS[m[1]] || s) : (SCHEDULES[s] || s);
            }
            // Read straight from the repo so new reports show up without waiting for GitHub Pages to rebuild.
            async function fetchRepoFile(path) {
              const bases = ghRepo ? ["https://raw.githubusercontent.com/" + ghRepo + "/main/", ""] : [""];
              let lastErr;
              for (const base of bases) {
                try {
                  const res = await fetch(base + path + "?t=" + Date.now(), { cache: "no-store" });
                  if (res.ok) return res;
                  lastErr = new Error(res.status);
                } catch (e) { lastErr = e; }
              }
              throw lastErr || new Error("not found");
            }
            async function getJson(path) { return (await fetchRepoFile(path)).json(); }
            async function runNow(agentId, btn) {
              if (!ghToken || !ghRepo) { alert("Add a GitHub token and repository in Settings to use Run now. Or run it in GitHub: Actions → Agent HQ → Run workflow."); return; }
              btn.disabled = true; btn.textContent = "Starting…";
              try {
                const res = await fetch("https://api.github.com/repos/" + ghRepo + "/actions/workflows/agent-hq.yml/dispatches", {
                  method: "POST",
                  headers: { "Authorization": "Bearer " + ghToken, "Accept": "application/vnd.github+json" },
                  body: JSON.stringify({ ref: "main", inputs: { agent: agentId } })
                });
                if (res.status !== 204) { const d = await res.json().catch(() => ({})); throw new Error(d.message || ("GitHub said " + res.status)); }
                btn.textContent = "Started — check back in ~2 min";
              } catch (e) {
                btn.disabled = false; btn.textContent = "Run now";
                alert("Couldn't start it: " + e.message);
              }
            }
            async function renderRoutines() {
              const list = $("routineList"), reports = $("reportList");
              list.innerHTML = '<p class="mute">Loading…</p>'; reports.innerHTML = "";
              let cfg;
              try { cfg = await getJson("agents.json"); }
              catch { list.innerHTML = '<p class="mute">No background agents found yet. In GitHub, run Actions → Agent HQ → Run workflow once.</p>'; return; }
              list.innerHTML = "";
              (cfg.agents || []).forEach(a => {
                const d = document.createElement("div");
                d.className = "log";
                d.innerHTML = '<div class="agent-head"><b>' + esc(a.name) + '</b><span class="pill">' + esc(a.enabled === false ? "Off" : scheduleLabel(a.schedule)) + '</span></div>' +
                  '<div class="mute">' + esc(a.instructions).slice(0, 140) + (String(a.instructions).length > 140 ? "…" : "") + '</div>';
                const b = document.createElement("button");
                b.className = "btn ghost"; b.textContent = "Run now"; b.style.marginTop = "6px";
                b.onclick = () => runNow(a.id, b);
                d.appendChild(b);
                list.appendChild(d);
              });
              let index = [];
              try { index = await getJson("reports/index.json"); } catch {}
              if (!index.length) { reports.innerHTML = '<div class="card mute">No reports yet. The first ones appear after the next scheduled run (about 7–8 AM Eastern) or after you tap Run now.</div>'; return; }
              index.slice(0, 40).forEach(r => {
                const c = document.createElement("div");
                c.className = "card";
                c.innerHTML = '<div class="agent-head"><b>' + esc(r.name) + '</b><span class="pill">' + esc(r.date) + '</span></div>' +
                  '<details><summary>Open report</summary><div class="out mute">Loading…</div></details>' +
                  '<div class="row"><button class="btn ghost" data-act="save">Save to Library</button><button class="btn ghost" data-act="share">Share</button></div>';
                let text = null;
                const load = async () => {
                  if (text != null) return text;
                  try { text = await (await fetchRepoFile("reports/" + encodeURIComponent(r.file))).text(); }
                  catch { text = "Couldn't load this report."; }
                  return text;
                };
                c.querySelector("details").addEventListener("toggle", async (e) => {
                  if (!e.target.open) return;
                  const out = c.querySelector(".out");
                  out.classList.remove("mute"); out.innerHTML = md(await load());
                });
                c.addEventListener("click", async (e) => {
                  const act = e.target.dataset && e.target.dataset.act;
                  if (act === "save") { saveToLibrary(r.name + " — " + r.date, await load()); e.target.textContent = "Saved"; }
                  if (act === "share") { shareText(r.name + " " + r.date, await load()); }
                });
                reports.appendChild(c);
              });
            }
            $("refreshRoutines").onclick = renderRoutines;
            $("ghToken").value = ghToken;
            $("ghRepo").value = ghRepo;
            $("saveGh").onclick = () => {
              ghToken = $("ghToken").value.trim(); ghRepo = $("ghRepo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, "");
              store.set("ghToken", ghToken); store.set("ghRepo", ghRepo);
              $("saveGh").textContent = "Saved"; setTimeout(() => $("saveGh").textContent = "Save", 1500);
            };

            // ---------- settings ----------
            $("apiKey").value = apiKey;
            $("context").value = context;
            $("saveKey").onclick = () => {
              apiKey = $("apiKey").value.trim();
              if (!apiKey) { alert("Paste your key first."); return; }
              store.set("key", apiKey); loadModels();
            };
            $("forgetKey").onclick = () => { apiKey = ""; model = ""; store.del("key"); store.del("model"); $("apiKey").value = ""; $("model").innerHTML = ""; $("keyStatus").textContent = "Key removed from this phone."; };
            $("model").onchange = () => { model = $("model").value; store.set("model", model); };
            $("saveContext").onclick = () => { context = $("context").value.trim() || DEFAULT_CONTEXT; store.set("context", context); $("saveContext").textContent = "Saved"; setTimeout(() => $("saveContext").textContent = "Save context", 1500); };

            // ---------- start ----------
            renderAgentSelect();
            renderRoutines();
            if (apiKey) loadModels();
            else $("keyStatus").textContent = "No key yet.";
          })();
          </script>
          </body>
          </html>
          AHQ_EOF
          [ -f agents.json ] || cat > agents.json <<'AHQ_EOF'
          {
            "model": "auto",
            "context": "Etsy shop selling original printable memorial kits (funeral/celebration-of-life programs, welcome signs, share-a-memory cards) as editable Canva templates and PDFs. Styles: Classic Elegance, Modern Minimal, Soft Watercolor Sky, Soft Botanical. Owner works only from an iPhone, budget $0, goal is sustainable side income. Buyers are grieving families: tone must be calm, respectful and simple.",
            "agents": [
              {
                "id": "daily-task",
                "name": "Daily Focus",
                "schedule": "daily",
                "instructions": "Give the owner ONE task for today that moves the shop forward and takes 30 minutes or less on an iPhone. Say exactly what to do, why it matters, and how to know it's done. Vary the task day to day across products, listings, marketing and records."
              },
              {
                "id": "content",
                "name": "Content Planner",
                "schedule": "weekly:mon",
                "instructions": "Plan this week's free marketing: 5 short TikTok or Pinterest post ideas for our memorial kits. For each: the hook (first line), a 20-30 second script or pin text, and what to show on screen. Tone: gentle, helpful, never salesy about grief."
              },
              {
                "id": "ideas",
                "name": "Product Ideas",
                "schedule": "weekly:wed",
                "instructions": "Suggest 3 new original memorial printable products that fit our existing styles. For each: what it is, who buys it and when, the pages/sizes included, and a suggested price. No recipes, patterns or how-to instruction products."
              },
              {
                "id": "listing",
                "name": "Listing Writer",
                "schedule": "weekly:fri",
                "instructions": "Pick one product from our kits or this week's product ideas and draft a complete Etsy listing: a title under 140 characters, exactly 13 tags of 20 characters or fewer, a description with a clear 'What you get' list and this AI disclosure line: 'Designed by me with the help of AI tools; previews show the real files you receive.' Mark it DRAFT - owner must review and publish."
              },
              {
                "id": "review",
                "name": "Weekly Review (Manager)",
                "schedule": "weekly:sun",
                "reads": "all",
                "instructions": "You are the manager. Read this week's reports from the team. Summarize: what was produced, the 3 best ideas, decisions the owner must make, anything needing approval (spending, publishing, contacting customers), and the top 3 priorities for next week."
              }
            ]
          }
          AHQ_EOF
          [ -f run-agents.mjs ] || cat > run-agents.mjs <<'AHQ_EOF'
          // Agent HQ routine runner — runs on GitHub Actions (free), calls Google Gemini (free tier),
          // and saves each agent's report into reports/ so the website can show it.
          import fs from "node:fs/promises";

          const API = process.env.API_BASE || "https://generativelanguage.googleapis.com/v1beta";
          const KEY = process.env.GEMINI_API_KEY;
          const MODE = (process.env.RUN_MODE || "due").trim(); // "due", "all", or an agent id
          const TZ = process.env.TIME_ZONE || "America/New_York";

          const RULES = "Rules: You write drafts and recommendations only. Never claim you published, spent money, contacted anyone or visited a website - you cannot. Flag anything needing the owner's approval. Follow Etsy's Creativity Standards: original designs, disclose AI use, real previews, no AI-written recipes/patterns/how-to instructions, never call AI work handmade. You have no live internet access: if a fact may be out of date (fees, policies, trends), say so. Keep it short and phone-friendly, using simple markdown (headings, bullets).";

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          function today() {
            const parts = new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", weekday: "short" }).formatToParts(new Date());
            const get = (t) => parts.find((p) => p.type === t).value;
            return { date: `${get("year")}-${get("month")}-${get("day")}`, dow: get("weekday").toLowerCase().slice(0, 3) };
          }

          function isDue(agent, dow) {
            if (agent.enabled === false) return false;
            if (MODE !== "due" && MODE !== "all") return agent.id === MODE;
            const s = String(agent.schedule || "manual").toLowerCase();
            if (s === "manual") return false;
            if (MODE === "all") return true;
            if (s === "daily") return true;
            if (s === "weekdays") return !["sat", "sun"].includes(dow);
            const m = s.match(/^weekly:([a-z]{3})$/);
            return Boolean(m && m[1] === dow);
          }

          async function api(path, init = {}) {
            for (let attempt = 1; attempt <= 3; attempt++) {
              const res = await fetch(API + path, { ...init, headers: { "Content-Type": "application/json", "x-goog-api-key": KEY, ...(init.headers || {}) } });
              if ((res.status === 429 || res.status === 503) && attempt < 3) { console.log(`  rate limited (${res.status}), waiting...`); await sleep(30000 * attempt); continue; }
              const data = await res.json().catch(() => ({}));
              if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
              return data;
            }
          }

          async function pickModel(wanted) {
            if (wanted && wanted !== "auto") return wanted.startsWith("models/") ? wanted : `models/${wanted}`;
            const { models = [] } = await api("/models?pageSize=200");
            const usable = models.filter((m) => (m.supportedGenerationMethods || []).includes("generateContent") && /gemini/i.test(m.name) && !/image|tts|audio|live|embed/i.test(m.name));
            const pick = usable.find((m) => /flash/i.test(m.name) && !/lite|preview|exp/i.test(m.name)) || usable.find((m) => /flash/i.test(m.name)) || usable[0];
            if (!pick) throw new Error("No usable Gemini model found for this key.");
            return pick.name;
          }

          async function readJson(path, fallback) {
            try { return JSON.parse(await fs.readFile(path, "utf8")); } catch { return fallback; }
          }

          async function weekOfReports(index, date) {
            const cutoff = new Date(date + "T00:00:00Z").getTime() - 7 * 86400000;
            const recent = index.filter((r) => new Date(r.date + "T00:00:00Z").getTime() >= cutoff && r.agent !== "review").slice(0, 20);
            let text = "";
            for (const r of recent) {
              const body = await fs.readFile(`reports/${r.file}`, "utf8").catch(() => "");
              text += `\n\n### ${r.name} (${r.date})\n${body.slice(0, 4000)}`;
            }
            return text.slice(0, 40000) || "\n\n(No reports from the team this week yet.)";
          }

          async function main() {
            if (!KEY) throw new Error("Missing GEMINI_API_KEY secret. Add it in GitHub: Settings > Secrets and variables > Actions.");
            const cfg = await readJson("agents.json", null);
            if (!cfg || !Array.isArray(cfg.agents)) throw new Error("agents.json is missing or broken.");
            const { date, dow } = today();
            const due = cfg.agents.filter((a) => isDue(a, dow));
            console.log(`Date ${date} (${dow}), mode "${MODE}": ${due.length} agent(s) due -> ${due.map((a) => a.id).join(", ") || "none"}`);
            if (!due.length) return;

            const model = await pickModel(cfg.model);
            console.log(`Model: ${model}`);
            await fs.mkdir("reports", { recursive: true });
            let index = await readJson("reports/index.json", []);
            let failures = 0;

            // Run team members first, the manager-style "reads" agents last so they see today's work.
            due.sort((a, b) => Boolean(a.reads) - Boolean(b.reads));

            for (const agent of due) {
              console.log(`Running ${agent.name}...`);
              try {
                let task = `Today is ${date}.\n\nYour job: ${agent.instructions}`;
                if (agent.reads) task += `\n\nThis week's team reports:${await weekOfReports(index, date)}`;
                const data = await api(`/${model}:generateContent`, {
                  method: "POST",
                  body: JSON.stringify({
                    systemInstruction: { parts: [{ text: `You are "${agent.name}", an agent on a small AI team.\n\nBusiness context: ${cfg.context}\n\n${RULES}` }] },
                    contents: [{ role: "user", parts: [{ text: task }] }],
                    generationConfig: { temperature: 0.8 }
                  })
                });
                const text = (data.candidates?.[0]?.content?.parts || []).map((p) => p.text || "").join("").trim();
                if (!text) throw new Error("empty reply");
                const file = `${date}-${agent.id}.md`;
                await fs.writeFile(`reports/${file}`, `# ${agent.name} - ${date}\n\n${text}\n`);
                index = [{ file, agent: agent.id, name: agent.name, date }, ...index.filter((r) => r.file !== file)].slice(0, 300);
                await fs.writeFile("reports/index.json", JSON.stringify(index, null, 2));
                console.log(`  saved reports/${file}`);
              } catch (e) {
                failures++;
                console.error(`  ${agent.name} failed: ${e.message}`);
              }
            }
            if (failures === due.length) throw new Error("Every agent failed this run.");
          }

          main().catch((e) => { console.error("ERROR:", e.message); process.exit(1); });
          AHQ_EOF

      - name: Run agents
        run: node run-agents.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY || secrets.GROQ }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RUN_MODE: ${{ github.event.inputs.agent || 'due' }}
      - name: Save reports
        if: always()
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Agent HQ update" && git push)
