name: Deep Researcher
on:
  schedule:
    - cron: "41 11 * * *" # daily, about 6:41am New York time
  workflow_dispatch:
permissions:
  contents: write
concurrency: agent-hq
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Research and write the brief
        run: node researcher.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY || secrets.GROQ }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save results
        if: always()
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports research
          git diff --cached --quiet || (git commit -m "Deep Researcher update" && git pull --rebase && git push)
