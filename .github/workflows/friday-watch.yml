name: Friday Watch
# Proactive Friday: every 30 minutes she checks for an important unread email or a meeting
# about to start, and pings Josiah's phone (ntfy) once per item. Quiet hours 11pm-7am. Sales ping instantly elsewhere.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask Friday to check in
        env:
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
        run: |
          KEY=$(printf "friday-check:%s" "$(echo -n "$PAYHIP_API_KEY" | tr -d '[:space:]')" | sha256sum | cut -d' ' -f1)
          curl -sS -m 90 -X POST https://foreverheld-sales.foreverheld.workers.dev/friday/watch -H "x-friday-key: $KEY" -H "content-type: application/json" -d '{}' | tee /tmp/r.json
          grep -q '"ok":true' /tmp/r.json
