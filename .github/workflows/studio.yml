name: Studio Afternoon Run
# Second daily run for the Studio team (MotionVault): fresh trends, clip plans and growth actions
# in Studio HQ on Discord. The morning run is part of the main Agent HQ workflow.
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: agent-hq
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh studio live data (read-only)
        run: node tools/studio-live.mjs
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      - name: Refresh studio YouTube data (read-only)
        run: node tools/youtube-trends.mjs
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Refresh our TikTok + Instagram stats (read-only, once a day)
        run: node tools/social-stats.mjs
        continue-on-error: true
        env:
          SCRAPCREATOR_API_KEY: ${{ secrets.SCRAPCREATOR_API_KEY }}
          SCRAPECREATOR_API_KEY: ${{ secrets.SCRAPECREATOR_API_KEY }}
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
      - name: Run agents
        run: node run-agents.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STUDIO_GEMINI_API_KEY: ${{ secrets.STUDIO_GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          STUDIO_DISCORD_BOT_TOKEN: ${{ secrets.STUDIO_DISCORD_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_KEY || secrets.GROQ }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          REQUESTY_KEY: ${{ secrets.REQUESTY_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_KEY || secrets.NVIDIA_NIM_API_KEY || secrets.NIM_API_KEY || secrets.NGC_API_KEY || secrets.NVIDIA }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          EXA_API_KEY_2: ${{ secrets.EXA_API_KEY_2 || secrets.EXA_KEY_2 || secrets.EXA_API_KEY2 }}
          RUN_MODE: group:studio
      - name: Save reports
        if: always()
        run: |
          SAVE_STRATEGY="-X theirs" bash tools/save.sh "Studio afternoon update"
      - name: Tell Discord if this run failed
        if: failure()
        run: node tools/discord-alert.mjs "Studio afternoon run failed"
        env:
          ALERT_CHANNEL: studio-alerts
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          STUDIO_DISCORD_BOT_TOKEN: ${{ secrets.STUDIO_DISCORD_BOT_TOKEN }}
