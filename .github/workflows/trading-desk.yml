name: Trading Desk
on:
  schedule:
    - cron: "35 15 * * 1-5" # weekdays, about 10:35am New York time
  workflow_dispatch:
    inputs:
      action:
        description: "run, pause, or resume"
        default: "run"
permissions:
  contents: write
concurrency: agent-hq
jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run trading desk
        run: node trading-desk.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          DESK_ACTION: ${{ github.event.inputs.action || 'run' }}
      - name: Save results
        if: always()
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || (git commit -m "Trading desk update" && git pull --rebase && git push)
