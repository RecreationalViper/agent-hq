name: Payhip Coupon
# Owner-approved promotions only: creates one Payhip coupon.
on:
  workflow_dispatch:
    inputs:
      code: { description: "Coupon code", required: true }
      percent: { description: "Percent off", required: true }
      until: { description: "Last day (YYYY-MM-DD, New York)", required: true }
      product: { description: "Payhip product id (blank = whole store)", required: false }
permissions:
  contents: read
jobs:
  coupon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/payhip-coupon.mjs "${{ inputs.code }}" "${{ inputs.percent }}" "${{ inputs.until }}" "${{ inputs.product }}"
        env:
          PAYHIP_API_KEY: ${{ secrets.PAYHIP_API_KEY }}
