name: Discord Setup
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: agent-hq
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create channels
        run: node tools/discord-setup.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          STUDIO_DISCORD_BOT_TOKEN: ${{ secrets.STUDIO_DISCORD_BOT_TOKEN }}
      - name: Save channel list
        run: |
          bash tools/save.sh "Discord channels" discord.json
      - name: Tell Discord if this run failed
        if: failure()
        run: node tools/discord-alert.mjs "Discord Setup run failed"
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
