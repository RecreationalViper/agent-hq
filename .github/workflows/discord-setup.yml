name: Discord Setup
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: agent-hq
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create channels
        run: node tools/discord-setup.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Save channel list
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord.json
          git diff --cached --quiet || (git commit -m "Discord channels" && git pull --rebase && git push)
