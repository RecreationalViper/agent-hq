name: Make Product Film
on:
  workflow_dispatch:
    inputs:
      format:
        description: "film (16:9 website) or pin (2:3 Pinterest)"
        default: "film"
      opening:
        description: "Opening shot: painted (free, no logo), magichour (free tier shows its logo), or none"
        default: "painted"
permissions:
  contents: write
concurrency: agent-hq
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the design browser and ffmpeg
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1 && npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Make the film
        run: node tools/make-film.mjs
        env:
          MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FILM_FORMAT: ${{ github.event.inputs.format || 'film' }}
          FILM_OPENING: ${{ github.event.inputs.opening || 'painted' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Save the film to the website
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/video
          git diff --cached --quiet || (git commit -m "Product film update" && git pull --rebase && git push)
