name: Web Developer
# Grows the live store with planning guides on our shift (skips while Ploy is running). Then publishes the store.
on:
  schedule:
    - cron: "47 15 * * *" # ~10:47 AM Eastern
    - cron: "47 21 * * *" # ~4:47 PM Eastern
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only (write nothing)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: agent-hq
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.save.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Write or improve one guide
        run: node tools/webdev.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
          REQUESTY_KEY: ${{ secrets.REQUESTY_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || secrets.NVIDIA_KEY || secrets.NVIDIA_NIM_API_KEY || secrets.NIM_API_KEY || secrets.NGC_API_KEY || secrets.NVIDIA }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Save
        id: save
        if: github.event.inputs.dry_run != 'true'
        run: |
          SAVE_STRATEGY="-X theirs" SAVE_OUTPUT_VAR=published bash tools/save.sh "Web Developer: new planning guide" store reports
      - name: Tell Discord if this run failed
        if: failure()
        run: node tools/discord-alert.mjs "Web Developer run failed"
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  deploy:
    needs: build
    if: needs.build.outputs.published == 'true'
    uses: ./.github/workflows/deploy-store.yml
    secrets: inherit
