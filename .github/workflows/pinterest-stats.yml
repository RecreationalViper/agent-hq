name: Pinterest Stats
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: agent-hq
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/pinterest-stats.mjs
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      - name: Save
        run: |
          SAVE_STRATEGY="-X theirs" bash tools/save.sh "Pinterest stats" pinterest
      - name: Tell Discord if this run failed
        if: failure()
        run: node tools/discord-alert.mjs "Pinterest Stats run failed"
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
