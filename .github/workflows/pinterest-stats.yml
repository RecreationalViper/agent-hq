name: Pinterest Stats
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: agent-hq
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/pinterest-stats.mjs
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
      - name: Save
        run: |
          git config user.name "agent-hq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pinterest
          git diff --cached --quiet || (git commit -m "Pinterest stats" && git pull --rebase -X theirs && git push)
