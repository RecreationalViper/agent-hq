<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{var:subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f3efe7;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{var:preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3efe7;">
<tr><td align="center" style="padding:28px 14px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
    <tr><td align="center" style="padding:0 0 18px;font-family:Georgia,'Lora','Times New Roman',serif;font-size:22px;color:#3d4a36;letter-spacing:.3px;">
      <span style="color:#647358;">&#10047;</span>&nbsp;Forever Held
    </td></tr>
    <tr><td style="background:#faf9f6;border:1px solid #dad8ce;border-radius:14px;padding:32px 30px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#3d4a36;">
      <h1 style="margin:0 0 18px;font-family:Georgia,'Lora','Times New Roman',serif;font-weight:400;font-size:24px;line-height:1.3;color:#3d4a36;">{{var:subject}}</h1>
      {{var:body}}
    </td></tr>
    <tr><td align="center" style="padding:20px 10px 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#5d6656;">
      You're getting this because you downloaded our free planning checklist.<br>
      Forever Held &middot; {{var:address}}<br>
      <a href="{{var:unsub}}" style="color:#5d6656;text-decoration:underline;">Unsubscribe</a>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
